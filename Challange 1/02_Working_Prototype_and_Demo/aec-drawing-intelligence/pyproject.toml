[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aecdi"
version = "0.1.0"
description = "AEC Drawing Intelligence: evidence-linked discrepancy detection across drawings, specs and BOQs"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "openpyxl>=3.1",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pydantic>=2.6",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "pandas>=2.0"]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
aecdi = "aecdi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
